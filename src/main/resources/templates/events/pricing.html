<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Pricing')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<main class="container">
    <div class="page-head">
        <h1>Pricing — <span th:text="${event.name()}">Event</span></h1>
        <a th:href="@{/events/{id}(id=${event.id()})}" class="btn secondary">Back</a>
    </div>

    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="card">
        <form th:object="${pricing}" method="post" th:action="@{/events/{id}/pricing(id=${event.id()})}">
            <div th:if="${hall.sections() != null and !hall.sections().isEmpty()}">
                <p class="muted">Set the price for each section of
                    <strong th:text="${hall.name()}">hall</strong>. Section names and prices are
                    fully configurable — no fixed categories.</p>
                <table class="table">
                    <thead>
                    <tr><th>Section</th><th>Type</th><th style="width:180px">Price</th><th>Currency</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, i : *{sections}">
                        <td>
                            <span th:text="${row.name}">Section</span>
                            <input type="hidden" th:field="*{sections[__${i.index}__].sectionId}"/>
                            <input type="hidden" th:field="*{sections[__${i.index}__].name}"/>
                        </td>
                        <td>
                            <span class="badge"
                                  th:text="${row.bookingMode == 'GENERAL_ADMISSION'} ? 'General admission' : 'Seated'">Seated</span>
                        </td>
                        <td>
                            <input type="number" step="0.01" min="0"
                                   th:field="*{sections[__${i.index}__].price}"/>
                        </td>
                        <td>
                            <input type="text" maxlength="8" style="width:80px"
                                   th:field="*{sections[__${i.index}__].currency}"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:unless="${hall.sections() != null and !hall.sections().isEmpty()}">
                <div class="alert error">This hall has no sections. Add a section in the hall editor before setting event pricing.</div>
            </div>
            <button th:if="${hall.sections() != null and !hall.sections().isEmpty()}"
                    type="submit" class="btn">Save pricing</button>
        </form>
    </div>
</main>
</body>
</html>
