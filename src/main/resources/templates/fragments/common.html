<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${title} + ' · Ticketing Admin'">Ticketing Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=5)}"/>
</head>
<body>

<header th:fragment="topbar" class="topbar">
    <span class="brand">🎟️ Ticketing Admin</span>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/organizers}">Organizers</a>
        <a th:href="@{/halls}">Halls</a>
        <a th:href="@{/events}">Events</a>
    </nav>
    <span class="spacer"></span>
    <span class="user" sec:authentication="name">admin</span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn secondary small">Log out</button>
    </form>
</header>

<div th:fragment="flash">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
</div>

</body>
</html>
