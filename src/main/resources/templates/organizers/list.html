<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Organizers')}"></head>
<body>
<header th:replace="~{fragments/common :: topbar}"></header>
<main class="container">
    <div th:replace="~{fragments/common :: flash}"></div>
    <div class="page-head">
        <h1>Organizers</h1>
        <a th:href="@{/organizers/new}" class="btn">New organizer</a>
    </div>

    <table>
        <thead>
        <tr><th>Name</th><th>Email</th><th>Phone</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${organizers}">
            <td th:text="${o.name()}">Name</td>
            <td th:text="${o.email()}">email</td>
            <td th:text="${o.phone()}">phone</td>
            <td class="actions">
                <a th:href="@{/organizers/{id}/edit(id=${o.id()})}" class="btn secondary small">Edit</a>
                <form class="inline" th:action="@{/organizers/{id}/delete(id=${o.id()})}" method="post"
                      onsubmit="return confirm('Delete this organizer?');">
                    <button type="submit" class="btn danger small">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(organizers)}">
            <td colspan="4" class="muted">No organizers yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
